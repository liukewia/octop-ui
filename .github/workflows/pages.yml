name: Deploy demo to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages 部署需要的三项权限：读代码、写 Pages、拿 OIDC token
permissions:
  contents: read
  pages: write
  id-token: write

# 同一分支只保留最新一次部署，避免旧构建覆盖新构建
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build demo
        run: npm run demo:build

      # 相对 base 的产物不需要注入 basePath，但这一步会顺带校验 Pages 配置
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
